name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · PHPStan, CS Fixer, PHPUnit
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: products
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d products"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: products
      DB_USER: app
      DB_PASSWORD: secret
      MESSENGER_TRANSPORT_DSN: in-memory://
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: amqp, intl, zip, gd, pdo_pgsql, bcmath, pcntl
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPUnit
        run: vendor/bin/phpunit

  frontend:
    name: Frontend · тесты и сборка
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  images:
    name: Docker · production-образы
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: PHP (multi-stage, target prod)
        run: docker build -f docker/php/Dockerfile --target prod -t products-import-php:prod .
      - name: Frontend (multi-stage, nginx)
        run: docker build -f docker/frontend/Dockerfile -t products-import-frontend:prod .

  e2e:
    name: E2E · Playwright на полном стеке
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Подготовить .env
        run: |
          cp .env.example .env
          sed -i "s/^UID=.*/UID=$(id -u)/; s/^GID=.*/GID=$(id -g)/" .env

      - name: Поднять стек (make init)
        run: make init

      - name: Дождаться API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 2
          done
          exit 1

      - name: E2E
        run: make e2e

      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Логи контейнеров
        if: failure()
        run: docker compose logs --tail=200
