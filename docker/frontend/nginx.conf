server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker: адрес backend-nginx перечитывается, если контейнер пересоздан
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://nginx:80;

    # API и картинки — в backend-nginx (сервис nginx).
    # Модификатор ^~ обязателен: без него запросы /uploads/*.jpg перехватит
    # regex-location для статики ниже, и nginx вернёт 404.
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    location ^~ /uploads/ {
        proxy_pass $backend;
    }

    # статика Angular с хешами в именах — кешируем надолго
    location ~* \.(?:js|css|woff2?|ico|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: все остальные пути отдаём index.html, маршрутизирует Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
