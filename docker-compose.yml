name: products-import

services:
  app:
    image: products-import-php:dev
    build: &php-build
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    env_file: .env
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: products-import-php:dev
    build: *php-build
    command: php bin/console app:worker -vv
    user: www-data
    # время на штатное завершение текущего импорта при docker stop
    stop_grace_period: 60s
    env_file: .env
    volumes:
      - ./backend:/var/www/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      - app

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - nginx

  # e2e-тесты Playwright: docker compose --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/frontend
    environment:
      HOME: /tmp
      CI: "1"
      E2E_BASE_URL: http://frontend
      E2E_USERNAME: ${ADMIN_USERNAME:-admin}
      E2E_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    volumes:
      - ./:/app
    # зависимости ставятся только при первом запуске
    command: sh -c "[ -d node_modules/@playwright/test ] || npm ci --no-audit --no-fund; npx playwright test"
    depends_on:
      - frontend
      - worker

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  db_data:
